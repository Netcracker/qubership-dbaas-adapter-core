        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dao.UserCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            $ref: '#/definitions/dao.CreatedUser'
        "500":
          description: Error occurred while user creation.
          schema:
            type: string
      security:
      - BasicAuth: []
      summary: Create user
      tags:
      - Database administration
  /api/{apiVersion}/dbaas/adapter/{appName}/users/{name}:
    put:
      consumes:
      - application/json
      description: |-
        Creates new user for specified database and returns it with connection information,
        or returns already created user if it exists. If database not specified will be used default database.
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: The username for creating user to database
        in: path
        name: name
        required: true
        type: string
      - description: Info about user to ensure
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dao.UserCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dao.CreatedUser'
        "500":
          description: Error occurred while user creation.
          schema:
            type: string
      security:
      - BasicAuth: []
      summary: Create user
      tags:
      - Database administration
  /api/{apiVersion}/dbaas/adapter/physical_database/force_registration:
    get:
      description: |-
        Force this adapter to immediately register itself in dbaas-aggregator.
        Adapter initiates background task that tries to register physical database in dbaas-aggregator,
        and responds with status 202 before the background task finishes.
      parameters:
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      responses:
        "202":
          description: if physical database registration process has been started
            successfully.
          schema:
            type: string
      summary: Force physical database registration
      tags:
      - Common dbaas adapter operations
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dao.Health'
