      tags:
      - Database administration
  /api/{apiVersion}/dbaas/adapter/{appName}/databases/{dbName}/migrate-to-vault/{userName}:
    post:
      consumes:
      - application/json
      description: Run migration of DB password to vault and returns vault secret
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: Databases to update
        in: path
        name: dbName
        required: true
        type: string
      - description: User whose password should be migrated
        in: path
        name: userName
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Vault role name
          schema:
            type: string
        "500":
          description: Unknown error
