  /api/{apiVersion}/dbaas/adapter/{appName}/describe/databases:
    post:
      consumes:
      - application/json
      description: Returns info about requested databases, this is optional API
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: If present - should return connection properties of each requested
          database
        in: query
        name: resources
        type: boolean
      - description: If present - should return resources of each requested database
        in: query
        name: connectionProperties
        type: boolean
      - description: List of names of databases to describe
