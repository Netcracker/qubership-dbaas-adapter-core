      - BasicAuth: []
      summary: Create database
      tags:
      - Database administration
  /api/{apiVersion}/dbaas/adapter/{appName}/databases/{dbName}/metadata:
    put:
      consumes:
      - application/json
      description: Changes metadata saved in databaase
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: Databases to update
        in: path
        name: dbName
        required: true
        type: string
      - description: New metadata
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Update metadata was successful
          schema:
            type: string
        "500":
          description: Error was occurred during update metadata.
