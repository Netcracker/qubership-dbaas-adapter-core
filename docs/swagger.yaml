  /api/{apiVersion}/dbaas/adapter/{appName}/users:
    put:
      consumes:
      - application/json
      description: |-
        Creates new user for specified database and returns it with connection information,
        or returns already created user if it exists. If database not specified will be used default database.
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
