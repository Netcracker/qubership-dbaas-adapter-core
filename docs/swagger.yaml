basePath: /
definitions:
  dao.BackupDatabaseInfo:
    properties:
      databaseName:
        type: string
    required:
    - databaseName
    type: object
  dao.BackupResponse:
    properties:
      backupId:
        type: string
      blobPath:
        type: string
      completionTime:
        type: string
      creationTime:
        type: string
      databases:
        items:
          $ref: '#/definitions/dao.LogicalDatabaseBackup'
        type: array
      errorMessage:
        type: string
      status:
        $ref: '#/definitions/dao.BackupRestoreStatus'
      storageName:
        type: string
    required:
    - backupId
    - blobPath
    - creationTime
    - databases
    - status
    - storageName
    type: object
  dao.BackupRestoreStatus:
    enum:
    - notStarted
    - inProgress
    - completed
    - failed
    type: string
    x-enum-varnames:
    - NotStartedStatus
    - InProgressStatus
    - CompletedStatus
    - FailedStatus
  dao.BadRequestResponse:
    properties:
      details:
        items:
          type: string
        type: array
      error:
        type: string
    type: object
  dao.ConnectionProperties:
    additionalProperties: {}
    type: object
  dao.CreateBackupRequest:
    properties:
      blobPath:
        type: string
      databases:
        items:
          $ref: '#/definitions/dao.BackupDatabaseInfo'
        type: array
      storageName:
        type: string
    required:
    - blobPath
    - databases
    - storageName
    type: object
  dao.CreateRestoreRequest:
    properties:
      blobPath:
        type: string
      databases:
        items:
          $ref: '#/definitions/dao.RestoreMapping'
        type: array
      storageName:
        type: string
    required:
    - blobPath
    - databases
    - storageName
    type: object
  dao.CreatedUser:
    properties:
      connectionProperties:
        $ref: '#/definitions/dao.ConnectionProperties'
      name:
        type: string
      resources:
        items:
          $ref: '#/definitions/dao.DbResource'
        type: array
      role:
        type: string
    type: object
  dao.DatabaseAdapterAction:
    enum:
    - BACKUP
    - RESTORE
    type: string
    x-enum-varnames:
    - BackupAction
    - RestoreAction
  dao.DatabaseAdapterBackupAdapterTrackStatus:
    enum:
    - FAIL
    - SUCCESS
    - PROCEEDING
    type: string
    x-enum-varnames:
    - FailTrackStatus
    - SuccessTrackStatus
    - ProceedingTrackStatus
  dao.DatabaseAdapterBaseTrack:
    properties:
      action:
        $ref: '#/definitions/dao.DatabaseAdapterAction'
      details:
        $ref: '#/definitions/dao.DatabasesBackupAdapt'
      status:
        $ref: '#/definitions/dao.DatabaseAdapterBackupAdapterTrackStatus'
      trackId:
        type: string
    type: object
  dao.DatabaseAdapterRestoreTrack:
    properties:
      action:
        $ref: '#/definitions/dao.DatabaseAdapterAction'
      changedNameDb:
        additionalProperties:
          type: string
        type: object
      details:
        $ref: '#/definitions/dao.DatabasesBackupAdapt'
      status:
        $ref: '#/definitions/dao.DatabaseAdapterBackupAdapterTrackStatus'
      trackId:
        type: string
    type: object
  dao.DatabasesBackupAdapt:
    properties:
      localId:
        type: string
    type: object
  dao.DbCreateRequest:
    properties:
      dbName:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      namePrefix:
        type: string
      password:
        type: string
      role:
        type: string
      settings:
        additionalProperties: {}
        type: object
      username:
        type: string
    type: object
  dao.DbCreateResponseMultiUser:
    properties:
      connectionDescription: {}
      connectionProperties:
        items:
          $ref: '#/definitions/dao.ConnectionProperties'
        type: array
      name:
        type: string
      resources:
        items:
          $ref: '#/definitions/dao.DbResource'
        type: array
    type: object
  dao.DbInfo:
    properties:
      microservice:
        type: string
      name:
        type: string
      namespace:
        type: string
      prefix:
        type: string
    type: object
  dao.DbResource:
    properties:
      errorMessage:
        type: string
      kind:
        type: string
      name:
        type: string
      status:
        $ref: '#/definitions/dao.DropResourceStatus'
    type: object
  dao.DropResourceStatus:
    enum:
    - DELETED
    - DELETE_FAILED
    type: string
    x-enum-varnames:
    - DELETED
    - DELETE_FAILED
  dao.Health:
    properties:
      physicalDatabaseRegistration:
        $ref: '#/definitions/dao.PhysicalDatabaseRegistrationHealth'
      status:
        type: string
    type: object
  dao.LogicalDatabaseBackup:
    properties:
      creationTime:
        type: string
      databaseName:
        type: string
      duration:
        type: integer
      errorMessage:
        type: string
      path:
        type: string
      size:
        type: integer
      status:
        $ref: '#/definitions/dao.BackupRestoreStatus'
    required:
    - databaseName
    - status
    type: object
  dao.LogicalDatabaseDescribed:
    properties:
      connectionProperties:
        items:
          $ref: '#/definitions/dao.ConnectionProperties'
        type: array
      resources:
        items:
          $ref: '#/definitions/dao.DbResource'
        type: array
    type: object
  dao.LogicalDatabaseRestore:
    properties:
      creationTime:
        type: string
      databaseName:
        type: string
      duration:
        type: integer
      errorMessage:
        type: string
      microserviceName:
        type: string
      namespace:
        type: string
      path:
        type: string
      prefix:
        type: string
      previousDatabaseName:
        type: string
      status:
        $ref: '#/definitions/dao.BackupRestoreStatus'
    required:
    - databaseName
    - status
    type: object
  dao.PhysicalDatabaseRegistrationHealth:
    properties:
      status:
        type: string
    type: object
  dao.RestorationRequest:
    properties:
      databases:
        items:
          $ref: '#/definitions/dao.DbInfo'
        type: array
      regenerateNames:
        type: boolean
    type: object
  dao.RestoreMapping:
    properties:
      databaseName:
        type: string
      microserviceName:
        type: string
      namespace:
        type: string
      prefix:
        type: string
    required:
    - databaseName
    - microserviceName
    - namespace
    type: object
  dao.RestoreResponse:
    properties:
      blobPath:
        type: string
      completionTime:
        type: string
      creationTime:
        type: string
      databases:
        items:
          $ref: '#/definitions/dao.LogicalDatabaseRestore'
        type: array
      errorMessage:
        type: string
      restoreId:
        type: string
      status:
        $ref: '#/definitions/dao.BackupRestoreStatus'
      storageName:
        type: string
    required:
    - blobPath
    - creationTime
    - databases
    - restoreId
    - status
    - storageName
    type: object
  dao.ServerErrorResponse:
    properties:
      error:
        type: string
      requestId:
        type: string
    type: object
  dao.UserCreateRequest:
    properties:
      dbName:
        type: string
      password:
        type: string
      role:
        type: string
      usernamePrefix:
        type: string
    type: object
  service.PhysicalDatabase:
    properties:
      id:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
    type: object
info:
  contact: {}
  title: Dbaas adapter API
  version: "1.0"
paths:
  /api/{apiVersion}/dbaas/adapter/{appName}/backups/{backupId}:
    delete:
      consumes:
      - application/json
      description: Returns deletion status
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: trackId
        in: path
        name: backupId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Succesfull delete
          schema:
            type: string
        "500":
          description: Unknown error
          schema:
            type: string
      security:
      - BasicAuth: []
      summary: Evict backup
      tags:
      - Backup and Restore
  /api/{apiVersion}/dbaas/adapter/{appName}/backups/{backupId}/restoration:
    post:
      consumes:
      - application/json
      description: Requests database backup daemon to restore specified backup with
        specified databases info
      parameters:
      - description: List of databases to restore
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dao.RestorationRequest'
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: Backup identifier
        in: path
        name: backupId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Restore requested
          schema:
            $ref: '#/definitions/dao.DatabaseAdapterRestoreTrack'
        "500":
          description: Unknown error
          schema:
            type: string
        "501":
          description: Cannot restore backup without explicitly specified list of
            databases in it
          schema:
            type: string
      security:
      - BasicAuth: []
      summary: Restore backup
      tags:
      - Backup and Restore
  /api/{apiVersion}/dbaas/adapter/{appName}/backups/{backupId}/restore:
    post:
      consumes:
      - application/json
      deprecated: true
      description: Requests database backup daemon to restore specified backup. Deprecated,
        please use /restoration endpoint instead
      parameters:
      - description: List of database names for restore
        in: body
        name: body
        required: true
        schema:
          items:
            type: string
          type: array
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: Backup identifier
        in: path
        name: backupId
        required: true
        type: string
      - description: If this parameter has value true then restored databases will
          have new names and will be passed through associative array changedNameDb
          in response object
        in: query
        name: regenerateNames
        type: boolean
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dao.DatabaseAdapterRestoreTrack'
        "500":
          description: Unknown error
          schema:
            type: string
        "501":
          description: Cannot restore backup without explicitly specified list of
            databases in it
          schema:
            type: string
      security:
      - BasicAuth: []
      summary: Restore backup
      tags:
      - Backup and Restore
  /api/{apiVersion}/dbaas/adapter/{appName}/backups/backup:
    post:
      consumes:
      - application/json
      description: Initiates a backup of specified databases and stores it in the
        configured storage. The operation is asynchronous and returns immediately
        with current status of backup.
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: Backup configuration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dao.CreateBackupRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Backup operation accepted and is being processed
          schema:
            $ref: '#/definitions/dao.BackupResponse'
        "400":
          description: The request was invalid or cannot be served
          schema:
            $ref: '#/definitions/dao.BadRequestResponse'
        "401":
          description: Authentication is required and has failed or has not been provided
          schema:
            type: string
        "403":
          description: The request was valid, but the server is refusing action
          schema:
            type: string
        "404":
          description: The requested resource could not be found
          schema:
            type: string
        "500":
          description: An unexpected error occurred on the server
          schema:
            $ref: '#/definitions/dao.ServerErrorResponse'
      security:
      - BasicAuth: []
      summary: Initiate database backup
      tags:
      - Backup and Restore
  /api/{apiVersion}/dbaas/adapter/{appName}/backups/backup/{backupId}:
    delete:
      description: Delete a backup operation
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: Unique identifier of the backup operation
        format: uuid
        in: path
        name: backupId
        required: true
        type: string
      - description: Backup or restore blob path
        in: query
        name: blobPath
        required: true
        type: string
      responses:
        "204":
          description: Backup deleted successfully
        "404":
          description: The requested resource could not be found
          schema:
            type: string
        "500":
          description: An unexpected error occurred on the server
          schema:
            $ref: '#/definitions/dao.ServerErrorResponse'
      security:
      - BasicAuth: []
      summary: Delete backup
      tags:
      - Backup and Restore
    get:
      description: Retrieve details about a specific backup operation
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: Unique identifier of the backup operation
        format: uuid
        in: path
        name: backupId
        required: true
        type: string
      - description: Backup or restore blob path
        in: query
        name: blobPath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Backup details retrieved successfully
          schema:
            $ref: '#/definitions/dao.BackupResponse'
        "404":
          description: The requested resource could not be found
          schema:
            type: string
        "500":
          description: An unexpected error occurred on the server
          schema:
            $ref: '#/definitions/dao.ServerErrorResponse'
      security:
      - BasicAuth: []
      summary: Get backup details
      tags:
      - Backup and Restore
  /api/{apiVersion}/dbaas/adapter/{appName}/backups/backup/{backupId}/restore:
    post:
      consumes:
      - application/json
      description: Restores databases from a previously created backup. Supports dry-run
        mode to validate the restore operation without making changes. The operation
        is asynchronous and returns immediately with current status of restore.
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: Unique identifier of the backup to restore from
        format: uuid
        in: path
        name: backupId
        required: true
        type: string
      - default: false
        description: If true, validates the restore operation without making any changes
        in: query
        name: dryRun
        type: boolean
      - description: Restore configuration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dao.CreateRestoreRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Restore operation accepted and is being processed
          schema:
            $ref: '#/definitions/dao.RestoreResponse'
        "400":
          description: The request was invalid or cannot be served
          schema:
            $ref: '#/definitions/dao.BadRequestResponse'
        "404":
          description: The requested resource could not be found
          schema:
            type: string
        "500":
          description: An unexpected error occurred on the server
          schema:
            $ref: '#/definitions/dao.ServerErrorResponse'
      security:
      - BasicAuth: []
      summary: Restore databases from backup
      tags:
      - Backup and Restore
  /api/{apiVersion}/dbaas/adapter/{appName}/backups/collect:
    post:
      consumes:
      - application/json
      description: Requests database backup daemon to collect backup for specified
        databases
      parameters:
      - description: Databases to backup
        in: body
        name: body
        required: true
        schema:
          items:
            type: string
          type: array
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/dao.DatabaseAdapterBaseTrack'
        "500":
          description: Unknown error
          schema:
            type: string
      security:
      - BasicAuth: []
      summary: Collect backup
      tags:
      - Backup and Restore
  /api/{apiVersion}/dbaas/adapter/{appName}/backups/restore/{restoreId}:
    delete:
      description: Delete a restore operation
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: Unique identifier of the restore operation
        format: uuid
        in: path
        name: restoreId
        required: true
        type: string
      - description: Backup or restore blob path
        in: query
        name: blobPath
        required: true
        type: string
      responses:
        "204":
          description: Restore deleted successfully
        "404":
          description: The requested resource could not be found
          schema:
            type: string
        "500":
          description: An unexpected error occurred on the server
          schema:
            $ref: '#/definitions/dao.ServerErrorResponse'
      security:
      - BasicAuth: []
      summary: Delete restore
      tags:
      - Backup and Restore
    get:
      description: Retrieves details of a restore operation
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: Unique identifier of the restore operation
        format: uuid
        in: path
        name: restoreId
        required: true
        type: string
      - description: Backup or restore blob path
        in: query
        name: blobPath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Restore details retrieved successfully
          schema:
            $ref: '#/definitions/dao.RestoreResponse'
        "404":
          description: The requested resource could not be found
          schema:
            type: string
        "500":
          description: An unexpected error occurred on the server
          schema:
            $ref: '#/definitions/dao.ServerErrorResponse'
      security:
      - BasicAuth: []
      summary: Get restore details
      tags:
      - Backup and Restore
  /api/{apiVersion}/dbaas/adapter/{appName}/backups/track/backup/{trackId}:
    get:
      description: Return status of backup task
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: trackId
        in: path
        name: trackId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dao.DatabaseAdapterBaseTrack'
        "500":
          description: Unknown error
          schema:
            type: string
      security:
      - BasicAuth: []
      summary: Track backup
      tags:
      - Backup and Restore
  /api/{apiVersion}/dbaas/adapter/{appName}/backups/track/restore/{trackId}:
    get:
      description: Return status of restore task
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: trackId
        in: path
        name: trackId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dao.DatabaseAdapterBaseTrack'
        "500":
          description: Unknown error
          schema:
            type: string
      security:
      - BasicAuth: []
      summary: Track restore
      tags:
      - Backup and Restore
  /api/{apiVersion}/dbaas/adapter/{appName}/databases:
    get:
      description: Returns list with names of databases
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Databases listed
          schema:
            items:
              type: string
            type: array
        "500":
          description: Error occurred while databases listing.
          schema:
            type: string
      security:
      - BasicAuth: []
      summary: List of all databases
      tags:
      - Database administration
    post:
      consumes:
      - application/json
      description: |-
        Creates database with one user having readWrite role in it and returns connection parameters including credentials.
        Also in created database provided metadata being inserted in _dbaas_metadata collection.
      parameters:
      - default: postgresql
        description: Application name
        enum:
        - postgresql
        - arangodb
        - clickhouse
        - mongodb
        - cassandra
        in: path
        name: appName
        required: true
        type: string
      - default: v2
        description: API version of dbaas adapter
        enum:
        - v1
        - v2
        in: path
        name: apiVersion
        required: true
        type: string
      - description: Create DB body request
